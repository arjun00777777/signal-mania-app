<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SignalMania</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
:root{
  --bg:#020617;
  --card:#0b1220;
  --neon:#00ffcc;
  --accent:#22c55e;
  --danger:#ef4444;
  --muted:#64748b;
  --border:#0f172a;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:ui-monospace,monospace;
  background:radial-gradient(circle at top,#050b18,#02040a);
  color:#e5e7eb;
}

.app{max-width:520px;margin:auto;padding-bottom:40px}

/* ---------- HEADER ---------- */
.header{
  padding:14px;
  border-bottom:1px solid var(--border);
}
.header h1{
  margin:0;
  font-size:18px;
  letter-spacing:2px;
}
.header .status{
  font-size:11px;
  color:var(--neon);
}

/* ---------- TABS ---------- */
.tabs{
  display:flex;
  gap:6px;
  margin-top:10px;
  flex-wrap:wrap;
}
.tabs button{
  flex:1;
  padding:8px 10px;
  background:#020617;
  border:1px solid var(--border);
  color:var(--muted);
  font-size:11px;
  border-radius:10px;
}
.tabs button.active{
  color:var(--neon);
  border-color:var(--neon);
  box-shadow:0 0 12px rgba(0,255,204,.25);
}

/* ---------- CARDS ---------- */
.card{
  background:linear-gradient(180deg,var(--card),#020617);
  border:1px solid var(--border);
  border-radius:16px;
  padding:14px;
  margin:12px;
  box-shadow:0 0 30px rgba(0,255,204,.04);
}

.small{font-size:12px;color:var(--muted)}

.btn{
  width:100%;
  padding:12px;
  border:none;
  border-radius:12px;
  background:linear-gradient(135deg,var(--accent),#16a34a);
  color:#022c22;
  font-weight:700;
}
.btn.red{background:linear-gradient(135deg,var(--danger),#b91c1c);color:#fff}
.btn.disabled{opacity:.4;pointer-events:none}

/* ---------- TERMINAL ---------- */
.terminal{
  background:#020617;
  border:1px solid var(--border);
  border-radius:12px;
  padding:10px;
  height:120px;
  overflow:hidden;
  font-size:12px;
  color:var(--neon);
}

/* ---------- LIST ---------- */
.list{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.item{
  background:#020617;
  border:1px solid var(--border);
  border-radius:12px;
  padding:10px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

/* ---------- PAGES ---------- */
.page{display:none}
.page.active{display:block}
</style>
</head>

<body>
<div class="app">

<!-- HEADER -->
<div class="header">
  <h1>SIGNALMANIA ▣</h1>
  <div class="status">SECURE NODE ONLINE</div>

  <div class="tabs">
    <button class="active" onclick="nav('node',this)">NODE</button>
    <button onclick="nav('signals',this)">SIGNALS</button>
    <button onclick="nav('alerts',this)">ALERTS</button>
    <button onclick="nav('tasks',this)">TASKS</button>
    <button onclick="nav('history',this)">HISTORY</button>
    <button onclick="nav('profile',this)">PROFILE</button>
  </div>
</div>

<!-- NODE -->
<div id="node" class="page active">
  <div class="card">
    <div class="small">NODE STATUS</div>
    <b id="nodeStatus">IDLE</b>
    <div class="small" id="timerText"></div><br>
    <div class="terminal" id="terminal"></div><br>
    <button id="mineBtn" class="btn" onclick="startMining()">START NODE</button>
  </div>

  <div class="card">
    <div>SP: <b id="sp">0</b></div>
    <div>LEVEL: <b id="level">1</b></div>
  </div>
</div>

<!-- SIGNALS -->
<div id="signals" class="page">
  <div class="card">
    <b>LIVE SIGNALS</b>
    <div id="signalsList" class="list"></div>
  </div>
</div>

<!-- ALERTS -->
<div id="alerts" class="page">
  <div class="card">
    <b>CREATE ALERT</b><br><br>
    <input id="aSymbol" placeholder="BTC" style="width:100%;padding:10px;border-radius:10px"/>
    <input id="aTarget" type="number" placeholder="Target" style="width:100%;padding:10px;border-radius:10px;margin-top:6px"/>
    <select id="aCond" style="width:100%;padding:10px;border-radius:10px;margin-top:6px">
      <option value="ABOVE">Above</option>
      <option value="BELOW">Below</option>
    </select><br><br>
    <button class="btn" onclick="createAlert()">CREATE ALERT</button>
  </div>

  <div class="card">
    <b>YOUR ALERTS</b>
    <div id="alertsList" class="list"></div>
  </div>
</div>

<!-- TASKS -->
<div id="tasks" class="page">
  <div class="card">
    <b>DAILY TASK</b>
    <div id="dailyTask" class="list"></div><br>
    <button id="dailyBtn" class="btn" onclick="claimDaily()">CLAIM TODAY</button>
    <div class="small" id="dailyInfo"></div>
  </div>

  <div class="card">
    <b>REFERRAL TASKS</b>
    <div id="refTasks" class="list"></div>
  </div>
</div>

<!-- HISTORY -->
<div id="history" class="page">
  <div class="card">
    <b>TASK HISTORY</b>
    <div id="taskHistory" class="list"></div>
  </div>
</div>

<!-- PROFILE -->
<div id="profile" class="page">
  <div class="card">
    <b>OPERATOR PROFILE</b><br><br>
    <div class="item">UID <span id="uidTxt"></span></div>
    <div class="item">SP <span id="sp2"></span></div>
    <div class="item">LEVEL <span id="level2"></span></div>
    <div class="item">REFERRALS <span id="refCount"></span></div><br>
    <div class="small">REFERRAL LINK</div>
    <input id="refLink" readonly style="width:100%;padding:10px;border-radius:10px"/>
  </div>
</div>

</div>

<!-- SOUNDS -->
<audio id="clickSound" src="https://assets.mixkit.co/sfx/preview/mixkit-select-click-1109.mp3"></audio>
<audio id="successSound" src="https://assets.mixkit.co/sfx/preview/mixkit-achievement-bell-600.mp3"></audio>

<script>
const API="https://claustral-mable-dissectible.ngrok-free.dev";
const UID=Telegram.WebApp.initDataUnsafe.user.id;

const clickSound=document.getElementById("clickSound");
const successSound=document.getElementById("successSound");

function apiPost(url,data={}){
  data.uid=UID;
  return fetch(API+url,{
    method:"POST",
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify(data)
  }).then(r=>r.json());
}

/* ---------- NAV ---------- */
function nav(id,btn){
  clickSound.play();
  document.querySelectorAll('.page').forEach(p=>p.classList.remove("active"));
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  btn.classList.add("active");

  if(id==="signals") loadSignals();
  if(id==="alerts") loadAlerts();
  if(id==="tasks") loadTasks();
  if(id==="history") loadHistory();
  if(id==="profile") loadProfile();
}

/* ---------- TERMINAL ---------- */
const term=document.getElementById("terminal");
function logTerm(t){
  term.innerHTML+=`&gt; ${t}<br>`;
  term.scrollTop=term.scrollHeight;
}

/* ---------- MINING ---------- */
async function refreshMining(){
  const d=await apiPost("/user/mining/stats");
  sp.innerText=d.sp;
  level.innerText=d.level;

  if(!d.running){
    nodeStatus.innerText="IDLE";
    mineBtn.classList.remove("disabled");
    mineBtn.innerText="START NODE";
    timerText.innerText="";
    return;
  }

  nodeStatus.innerText="ACTIVE";
  mineBtn.classList.add("disabled");
  mineBtn.innerText="NODE RUNNING";

  let rem=d.remaining;
  updateTimer(rem);

  setTimeout(refreshMining,1000);
}

function updateTimer(sec){
  const h=Math.floor(sec/3600);
  const m=Math.floor((sec%3600)/60);
  const s=sec%60;
  timerText.innerText=`TIME LEFT ${h}h ${m}m ${s}s`;
  logTerm("Processing encrypted packets...");
}

function startMining(){
  clickSound.play();
  mineBtn.classList.add("disabled");
  logTerm("Bootstrapping secure node...");
  apiPost("/user/mining/start").then(refreshMining);
}

/* ---------- SIGNALS ---------- */
function loadSignals(){
  fetch(API+"/market/signals",{method:"POST"})
  .then(r=>r.json())
  .then(d=>{
    signalsList.innerHTML="";
    d.forEach(s=>{
      signalsList.innerHTML+=`
        <div class="item">
          ${s.symbol}
          <span>$${s.price}</span>
        </div>`;
    });
  });
}

/* ---------- ALERTS ---------- */
function loadAlerts(){
  apiPost("/alert/list").then(d=>{
    alertsList.innerHTML="";
    d.forEach(a=>{
      alertsList.innerHTML+=`
        <div class="item">
          ${a[1]} ${a[3]} ${a[2]}
          <button class="btn red" onclick="delAlert(${a[0]})">X</button>
        </div>`;
    });
  });
}
function createAlert(){
  apiPost("/alert/create",{symbol:aSymbol.value,target:aTarget.value,condition:aCond.value})
  .then(()=>{successSound.play();loadAlerts();});
}
function delAlert(id){
  apiPost("/alert/delete",{id}).then(loadAlerts);
}

/* ---------- TASKS ---------- */
async function loadTasks(){
  const p=await apiPost("/user/profile");
  dailyTask.innerHTML=`<div class="item">DAY ${p.daily_day+1} <span>REWARD</span></div>`;
  dailyBtn.classList.remove("disabled");
}

async function claimDaily(){
  const r=await apiPost("/claim/daily");
  if(r.ok){
    successSound.play();
    dailyBtn.classList.add("disabled");
    dailyInfo.innerText="CLAIMED";
  }
}

/* ---------- HISTORY ---------- */
function loadHistory(){
  apiPost("/tasks/history").then(d=>{
    taskHistory.innerHTML="";
    d.forEach(t=>{
      taskHistory.innerHTML+=`
        <div class="item">
          ${t[0]}
          <span>+${t[1]}</span>
        </div>`;
    });
  });
}

/* ---------- PROFILE ---------- */
async function loadProfile(){
  const d=await apiPost("/user/profile");
  uidTxt.innerText=UID;
  sp2.innerText=d.sp;
  level2.innerText=d.level;
  refCount.innerText=d.referral_count;
  refLink.value=`https://t.me/Whale_alert_info_bot?start=${UID}`;
}

/* ---------- INIT ---------- */
setTimeout(refreshMining,800);
</script>
</body>
</html>

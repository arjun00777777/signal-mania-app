<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignalMania - Crypto Signals & Mining</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 600px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { font-size: 2rem; margin-bottom: 10px; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
        .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-bottom: 30px; }
        .stat-card {
            background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px);
            border-radius: 15px; padding: 20px; border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .stat-label { font-size: 0.9rem; opacity: 0.8; margin-bottom: 5px; }
        .stat-value { font-size: 1.8rem; font-weight: bold; }
        .section {
            background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px);
            border-radius: 15px; padding: 20px; margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .section h2 { font-size: 1.3rem; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; }
        .mining-timer { font-size: 2rem; font-weight: bold; text-align: center; margin: 20px 0; font-family: 'Courier New', monospace; }
        .progress-bar { width: 100%; height: 20px; background: rgba(0, 0, 0, 0.3); border-radius: 10px; overflow: hidden; margin: 15px 0; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #4ade80, #22c55e); transition: width 0.3s ease; }
        .btn { width: 100%; padding: 15px; font-size: 1rem; font-weight: bold; border: none; border-radius: 10px; cursor: pointer; transition: all 0.3s; margin-bottom: 10px; }
        .btn-primary { background: linear-gradient(135deg, #4ade80, #22c55e); color: white; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(74, 222, 128, 0.4); }
        .btn-secondary { background: rgba(255, 255, 255, 0.2); color: white; border: 1px solid rgba(255, 255, 255, 0.3); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .signals-list { max-height: 300px; overflow-y: auto; }
        .signal-item { background: rgba(0, 0, 0, 0.2); padding: 12px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .signal-symbol { font-weight: bold; font-size: 1.1rem; }
        .signal-change { padding: 5px 10px; border-radius: 5px; font-weight: bold; }
        .signal-positive { background: rgba(74, 222, 128, 0.3); color: #4ade80; }
        .signal-negative { background: rgba(239, 68, 68, 0.3); color: #ef4444; }
        .upgrade-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 15px; }
        .upgrade-card { background: rgba(0, 0, 0, 0.2); padding: 15px; border-radius: 10px; text-align: center; }
        .upgrade-card h3 { font-size: 1rem; margin-bottom: 10px; }
        .upgrade-cost { color: #fbbf24; font-weight: bold; margin: 10px 0; }
        .loading { text-align: center; padding: 20px; font-size: 1.2rem; }
        .alert-form { margin-top: 15px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 0.9rem; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.3); background: rgba(0, 0, 0, 0.2); color: white; font-size: 1rem; }
        .alerts-list { margin-top: 15px; }
        .alert-item { background: rgba(0, 0, 0, 0.2); padding: 12px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .delete-btn { background: rgba(239, 68, 68, 0.3); color: #ef4444; border: none; padding: 5px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
        .mining-active { animation: pulse 2s infinite; }
        .error-msg { background: rgba(239, 68, 68, 0.3); color: #ef4444; padding: 10px; border-radius: 8px; margin-bottom: 15px; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⚡ SignalMania</h1>
            <p>Crypto Signals & Hash Mining</p>
        </div>

        <div id="loading" class="loading">
            🔄 Loading...
        </div>

        <div id="app" style="display: none;">
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">⚡ Hashes</div>
                    <div class="stat-value" id="hashCount">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">⛏️ Level</div>
                    <div class="stat-value" id="miningLevel">1</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">👥 Referrals</div>
                    <div class="stat-value" id="referralCount">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">⭐ Status</div>
                    <div class="stat-value" id="premiumStatus">Free</div>
                </div>
            </div>

            <div class="section">
                <h2>⛏️ Hash Mining</h2>
                <div class="mining-timer" id="miningTimer">05:00</div>
                <div class="progress-bar">
                    <div class="progress-fill" id="miningProgress" style="width: 0%"></div>
                </div>
                <button class="btn btn-primary" id="startMiningBtn">Start Mining</button>
                <button class="btn btn-secondary" id="claimDailyBtn">Claim Daily Bonus (100 Hashes)</button>
            </div>

            <div class="section">
                <h2>🚀 Upgrades</h2>
                <div class="upgrade-grid">
                    <div class="upgrade-card">
                        <h3>⏱️ Time Pack</h3>
                        <p>10 min sessions</p>
                        <div class="upgrade-cost">50 Hashes</div>
                        <button class="btn btn-primary" onclick="upgradePackage('time')">Upgrade</button>
                    </div>
                    <div class="upgrade-card">
                        <h3>⚡ Boost Pack</h3>
                        <p>30 min sessions</p>
                        <div class="upgrade-cost">100 Hashes</div>
                        <button class="btn btn-primary" onclick="upgradePackage('boost')">Upgrade</button>
                    </div>
                </div>
            </div>

            <div class="section">
                <h2>📊 Market Signals</h2>
                <div class="signals-list" id="signalsList">
                    <div class="loading">Loading signals...</div>
                </div>
                <button class="btn btn-secondary" onclick="refreshSignals()">🔄 Refresh Signals</button>
            </div>

            <div class="section">
                <h2>🔔 Price Alerts</h2>
                <div class="alert-form">
                    <div class="form-group">
                        <label>Symbol (e.g., BTC)</label>
                        <input type="text" id="alertSymbol" placeholder="BTC">
                    </div>
                    <div class="form-group">
                        <label>Target Price</label>
                        <input type="number" id="alertPrice" placeholder="50000">
                    </div>
                    <div class="form-group">
                        <label>Condition</label>
                        <select id="alertCondition">
                            <option value="ABOVE">Above</option>
                            <option value="BELOW">Below</option>
                        </select>
                    </div>
                    <button class="btn btn-primary" onclick="createAlert()">Create Alert</button>
                </div>
                <div class="alerts-list" id="alertsList"></div>
            </div>
        </div>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        // Wait for Telegram WebApp to load
        window.addEventListener('load', function() {
            if (!window.Telegram || !window.Telegram.WebApp) {
                console.warn('Not running in Telegram WebApp');
                window.Telegram = {
                    WebApp: {
                        ready: () => {},
                        expand: () => {},
                        initData: '',
                        initDataUnsafe: { user: { id: 123456789 } }
                    }
                };
            }
            initializeApp();
        });

        // --- UPDATED API URL HERE ---
        const API_BASE = 'https://claustral-mable-dissectible.ngrok-free.dev';
        
        let tg = null;
        let initData = '';
        let miningInterval = null;
        let miningStartTime = null;
        let maxMiningTime = 300;
        let currentSP = 0;
        let currentLevel = 1;

        function initializeApp() {
            tg = window.Telegram.WebApp;
            tg.ready();
            tg.expand();
            initData = tg.initData;
            init();
        }

        async function init() {
            try {
                await loadUserStats();
                await loadMiningStats();
                await loadSignals();
                await loadAlerts();
                document.getElementById('loading').style.display = 'none';
                document.getElementById('app').style.display = 'block';
            } catch (error) {
                console.error('Init error:', error);
                document.getElementById('loading').innerHTML = 
                    '<div class="error-msg">⚠️ Failed to connect to server.<br>Make sure Python backend is running.</div>';
            }
        }

        async function loadUserStats() {
            const uid = tg.initDataUnsafe?.user?.id;
            if (!uid) return;
            try {
                const response = await fetch(`${API_BASE}/user/referrals`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ uid })
                });
                const data = await response.json();
                document.getElementById('referralCount').textContent = data.referrals || 0;
                document.getElementById('premiumStatus').textContent = data.referrals >= 5 ? 'PRO' : 'Free';
            } catch (error) { console.error('Load stats error:', error); }
        }

        async function loadMiningStats() {
            try {
                const response = await fetch(`${API_BASE}/user/mining/stats`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ initData })
                });
                const data = await response.json();
                currentSP = data.sp;
                currentLevel = data.level;
                maxMiningTime = data.max_time;
                document.getElementById('hashCount').textContent = currentSP;
                document.getElementById('miningLevel').textContent = currentLevel;
            } catch (error) { console.error('Load mining stats error:', error); }
        }

        document.getElementById('startMiningBtn').addEventListener('click', function() {
            if (miningInterval) { stopMining(); } else { startMining(); }
        });

        function startMining() {
            miningStartTime = Date.now();
            const btn = document.getElementById('startMiningBtn');
            btn.textContent = 'Stop Mining';
            btn.classList.add('mining-active');
            miningInterval = setInterval(updateMiningProgress, 100);
        }

        function updateMiningProgress() {
            const elapsed = Math.floor((Date.now() - miningStartTime) / 1000);
            const remaining = Math.max(0, maxMiningTime - elapsed);
            const minutes = Math.floor(remaining / 60);
            const seconds = remaining % 60;
            document.getElementById('miningTimer').textContent = 
                `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            const progress = (elapsed / maxMiningTime) * 100;
            document.getElementById('miningProgress').style.width = Math.min(progress, 100) + '%';
            if (remaining <= 0) { completeMining(); }
        }

        async function completeMining() {
            clearInterval(miningInterval);
            miningInterval = null;
            try {
                const response = await fetch(`${API_BASE}/user/mining/complete`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ initData })
                });
                const data = await response.json();
                if (data.status === 'success') {
                    currentSP = data.new_sp;
                    document.getElementById('hashCount').textContent = currentSP;
                    alert('🎉 Mining complete! +100 Hashes');
                }
            } catch (error) { console.error('Complete mining error:', error); }
            resetMiningUI();
        }

        function stopMining() {
            clearInterval(miningInterval);
            miningInterval = null;
            resetMiningUI();
        }

        function resetMiningUI() {
            const btn = document.getElementById('startMiningBtn');
            btn.textContent = 'Start Mining';
            btn.classList.remove('mining-active');
            document.getElementById('miningTimer').textContent = 
                `${String(Math.floor(maxMiningTime / 60)).padStart(2, '0')}:00`;
            document.getElementById('miningProgress').style.width = '0%';
        }

        document.getElementById('claimDailyBtn').addEventListener('click', async function() {
            try {
                const response = await fetch(`${API_BASE}/user/daily_claim`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ initData })
                });
                const data = await response.json();
                if (data.status === 'success') {
                    currentSP = data.new_sp;
                    document.getElementById('hashCount').textContent = currentSP;
                    alert('✅ Claimed 100 Hashes!');
                } else { alert(data.message || 'Claim failed'); }
            } catch (error) { console.error('Daily claim error:', error); alert('Failed to claim bonus'); }
        });

        async function upgradePackage(packType) {
            try {
                const response = await fetch(`${API_BASE}/user/mining/upgrade`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ initData, pack: packType })
                });
                const data = await response.json();
                if (data.status === 'success') {
                    currentSP = data.new_sp;
                    currentLevel = data.new_level;
                    maxMiningTime = data.new_max_time;
                    document.getElementById('hashCount').textContent = currentSP;
                    document.getElementById('miningLevel').textContent = currentLevel;
                    resetMiningUI();
                    alert(data.message || 'Upgrade successful!');
                } else { alert(data.message || 'Upgrade failed'); }
            } catch (error) { console.error('Upgrade error:', error); alert('Upgrade failed'); }
        }

        async function loadSignals() {
            try {
                const response = await fetch(`${API_BASE}/market/signals`);
                const signals = await response.json();
                const container = document.getElementById('signalsList');
                if (signals.length === 0) {
                    container.innerHTML = '<div class="loading">No signals available</div>';
                    return;
                }
                container.innerHTML = signals.map(signal => `
                    <div class="signal-item">
                        <div>
                            <div class="signal-symbol">${signal.symbol}</div>
                            <div style="font-size: 0.9rem; opacity: 0.8;">$${signal.price.toFixed(2)}</div>
                        </div>
                        <div class="signal-change ${signal.change >= 0 ? 'signal-positive' : 'signal-negative'}">
                            ${signal.change >= 0 ? '+' : ''}${signal.change}%
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Load signals error:', error);
                document.getElementById('signalsList').innerHTML = '<div class="error-msg">Failed to load signals</div>';
            }
        }

        function refreshSignals() { loadSignals(); }

        async function createAlert() {
            const symbol = document.getElementById('alertSymbol').value.trim().toUpperCase();
            const price = parseFloat(document.getElementById('alertPrice').value);
            const condition = document.getElementById('alertCondition').value;
            if (!symbol || !price) { alert('Please fill all fields'); return; }
            try {
                const response = await fetch(`${API_BASE}/alert/create`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ initData, symbol, price, condition })
                });
                const data = await response.json();
                if (data.status === 'success') {
                    alert('✅ Alert created!');
                    document.getElementById('alertSymbol').value = '';
                    document.getElementById('alertPrice').value = '';
                    loadAlerts();
                } else { alert(data.message || 'Failed to create alert'); }
            } catch (error) { console.error('Create alert error:', error); alert('Failed to create alert'); }
        }

        async function loadAlerts() {
            try {
                const response = await fetch(`${API_BASE}/alert/list`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ initData })
                });
                const alerts = await response.json();
                const container = document.getElementById('alertsList');
                if (alerts.length === 0) {
                    container.innerHTML = '<p style="opacity: 0.7; margin-top: 10px;">No alerts set</p>';
                    return;
                }
                container.innerHTML = alerts.map(alert => `
                    <div class="alert-item">
                        <div>
                            <div style="font-weight: bold;">${alert.symbol}</div>
                            <div style="font-size: 0.9rem; opacity: 0.8;">
                                ${alert.condition} $${alert.price} - ${alert.status}
                            </div>
                        </div>
                        ${alert.status === 'ACTIVE' ? 
                            `<button class="delete-btn" onclick="deleteAlert(${alert.id})">Delete</button>` : ''}
                    </div>
                `).join('');
            } catch (error) { console.error('Load alerts error:', error); }
        }

        async function deleteAlert(alertId) {
            try {
                await fetch(`${API_BASE}/alert/delete`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ initData, alert_id: alertId })
                });
                loadAlerts();
            } catch (error) { console.error('Delete alert error:', error); }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignalMania</title>
    <style>
        :root {
            --primary: #4ade80;
            --bg-dark: #1a1b26;
            --card-bg: rgba(255, 255, 255, 0.08);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(180deg, #13151a 0%, #1a1b26 100%);
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden; /* Prevent body scroll, handle in pages */
        }
        
        /* Main Content Area */
        .page-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            padding-bottom: 80px; /* Space for bottom nav */
            display: none; /* Hidden by default */
        }
        
        .page-container.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        /* Stats Header */
        .balance-card {
            text-align: center;
            padding: 30px 0;
        }
        .balance-title { font-size: 0.9rem; opacity: 0.7; margin-bottom: 5px; }
        .balance-value { font-size: 3rem; font-weight: 800; letter-spacing: -1px; }
        .balance-unit { font-size: 1rem; color: var(--primary); font-weight: bold; }

        /* Mining Circle */
        .mining-circle {
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(74,222,128,0.2) 0%, rgba(0,0,0,0) 70%);
            border-radius: 50%;
            margin: 0 auto 30px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 2px solid rgba(74, 222, 128, 0.3);
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
        }
        
        .mining-circle:active { transform: scale(0.95); }
        .mining-circle.active { box-shadow: 0 0 30px rgba(74, 222, 128, 0.4); border-color: var(--primary); }
        .timer-text { font-size: 2rem; font-family: 'Courier New', monospace; font-weight: bold; }
        .status-text { font-size: 0.9rem; opacity: 0.8; margin-top: 5px; }

        /* Bottom Nav */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(20, 20, 30, 0.95);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255,255,255,0.1);
            display: flex;
            justify-content: space-around;
            padding: 15px 0;
            z-index: 100;
        }
        
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 0.75rem;
            color: #888;
            cursor: pointer;
            transition: color 0.2s;
        }
        
        .nav-item.active { color: var(--primary); }
        .nav-icon { font-size: 1.5rem; margin-bottom: 4px; }

        /* General UI Elements */
        .section {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 15px;
        }
        .btn {
            background: var(--primary);
            color: #000;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
        }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        
        /* Signal Item */
        .signal-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: rgba(0,0,0,0.2);
            border-radius: 12px;
            margin-bottom: 10px;
        }
        .signal-up { color: #4ade80; }
        .signal-down { color: #ef4444; }

        /* Animation */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .pulse { animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }
    </style>
</head>
<body>

    <div id="page-home" class="page-container active">
        <div class="balance-card">
            <div class="balance-title">Available Balance</div>
            <div><span class="balance-value" id="hashCount">0</span> <span class="balance-unit">SP</span></div>
        </div>

        <div class="mining-circle" id="miningBtn" onclick="handleMiningClick()">
            <div class="timer-text" id="miningTimer">Start</div>
            <div class="status-text" id="miningStatus">Tap to Mine</div>
        </div>

        <button id="claimBtn" class="btn" style="display: none; background: #facc15;" onclick="claimReward()">
            🎉 Claim 100 SP
        </button>

        <div class="section" style="margin-top: 20px;">
            <h3>🚀 Boosters</h3>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px;">
                <div style="background: rgba(0,0,0,0.2); padding: 10px; border-radius: 10px; text-align: center;">
                    <div>Time +</div>
                    <div style="color: #facc15; font-size: 0.9rem;">50 SP</div>
                    <button style="width: 100%; margin-top: 5px; padding: 5px; border:none; border-radius: 5px; background: rgba(255,255,255,0.1); color: white;" onclick="upgrade('time')">Buy</button>
                </div>
                <div style="background: rgba(0,0,0,0.2); padding: 10px; border-radius: 10px; text-align: center;">
                    <div>Speed +</div>
                    <div style="color: #facc15; font-size: 0.9rem;">100 SP</div>
                    <button style="width: 100%; margin-top: 5px; padding: 5px; border:none; border-radius: 5px; background: rgba(255,255,255,0.1); color: white;" onclick="upgrade('boost')">Buy</button>
                </div>
            </div>
        </div>
    </div>

    <div id="page-signals" class="page-container">
        <h2 style="margin-bottom: 20px;">📊 Live Signals</h2>
        <div id="signalsList">
            <div style="text-align: center; padding: 20px;" class="pulse">Loading market data...</div>
        </div>
        <button class="btn" style="margin-top: 15px; background: #333; color: white;" onclick="loadSignals()">Refresh Data</button>
    </div>

    <div id="page-alerts" class="page-container">
        <h2 style="margin-bottom: 20px;">🔔 Price Alerts</h2>
        <div class="section">
            <input type="text" id="alertSymbol" placeholder="Symbol (e.g. BTC)" style="width: 100%; padding: 12px; border-radius: 8px; border: none; margin-bottom: 10px; background: rgba(0,0,0,0.3); color: white;">
            <input type="number" id="alertPrice" placeholder="Target Price" style="width: 100%; padding: 12px; border-radius: 8px; border: none; margin-bottom: 10px; background: rgba(0,0,0,0.3); color: white;">
            <select id="alertCondition" style="width: 100%; padding: 12px; border-radius: 8px; border: none; margin-bottom: 10px; background: rgba(0,0,0,0.3); color: white;">
                <option value="ABOVE">Price Goes Above</option>
                <option value="BELOW">Price Goes Below</option>
            </select>
            <button class="btn" onclick="createAlert()">Set Alert</button>
        </div>
        <div id="alertsList"></div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchPage('home', this)">
            <div class="nav-icon">⛏️</div>
            <div>Mine</div>
        </div>
        <div class="nav-item" onclick="switchPage('signals', this)">
            <div class="nav-icon">📈</div>
            <div>Signals</div>
        </div>
        <div class="nav-item" onclick="switchPage('alerts', this)">
            <div class="nav-icon">🔔</div>
            <div>Alerts</div>
        </div>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        // CONFIG
        const API_BASE = 'https://claustral-mable-dissectible.ngrok-free.dev'; // YOUR NGROK URL
        
        let tg = window.Telegram.WebApp;
        tg.expand();
        let initData = tg.initData;

        let state = {
            sp: 0,
            level: 1,
            maxTime: 300,
            startTime: 0, // Server timestamp when mining started
            timerId: null
        };

        // --- INIT ---
        window.onload = function() {
            // Mock data for testing in browser if not in TG
            if (!initData) {
                console.warn("No Telegram InitData found. Mode: Testing");
            }
            refreshData();
            // Auto refresh signals
            setInterval(loadSignals, 30000); 
        };

        // --- NAVIGATION ---
        function switchPage(pageName, navElement) {
            // Hide all pages
            document.querySelectorAll('.page-container').forEach(el => el.classList.remove('active'));
            // Show target page
            document.getElementById(`page-${pageName}`).classList.add('active');
            
            // Update nav active state
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            navElement.classList.add('active');

            // Load data if needed
            if(pageName === 'signals') loadSignals();
            if(pageName === 'alerts') loadAlerts();
        }

        // --- MINING LOGIC ---
        async function refreshData() {
            try {
                const res = await fetch(`${API_BASE}/user/mining/stats`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json', 'ngrok-skip-browser-warning': 'true'},
                    body: JSON.stringify({ initData })
                });
                const data = await res.json();
                
                state.sp = data.sp;
                state.level = data.level;
                state.maxTime = data.max_time;
                state.startTime = data.start_time;

                document.getElementById('hashCount').innerText = state.sp;
                
                checkMiningStatus();
            } catch(e) { console.error("Sync error", e); }
        }

        function checkMiningStatus() {
            if (state.timerId) clearInterval(state.timerId);

            if (state.startTime === 0) {
                // Not mining
                renderMiningUI('idle');
            } else {
                // Mining in progress (or finished)
                const now = Math.floor(Date.now() / 1000);
                const elapsed = now - state.startTime;
                
                if (elapsed >= state.maxTime) {
                    renderMiningUI('claim');
                } else {
                    renderMiningUI('mining');
                    startLocalTimer(state.maxTime - elapsed);
                }
            }
        }

        function startLocalTimer(secondsLeft) {
            updateTimerDisplay(secondsLeft);
            state.timerId = setInterval(() => {
                secondsLeft--;
                updateTimerDisplay(secondsLeft);
                if (secondsLeft <= 0) {
                    clearInterval(state.timerId);
                    renderMiningUI('claim');
                }
            }, 1000);
        }

        function updateTimerDisplay(seconds) {
            const m = Math.floor(seconds / 60).toString().padStart(2, '0');
            const s = (seconds % 60).toString().padStart(2, '0');
            document.getElementById('miningTimer').innerText = `${m}:${s}`;
        }

        function renderMiningUI(mode) {
            const circle = document.getElementById('miningBtn');
            const status = document.getElementById('miningStatus');
            const claimBtn = document.getElementById('claimBtn');
            const timerTxt = document.getElementById('miningTimer');

            if (mode === 'idle') {
                circle.classList.remove('active');
                circle.style.display = 'flex';
                claimBtn.style.display = 'none';
                timerTxt.innerText = "Start";
                status.innerText = "Tap to Mine";
            } else if (mode === 'mining') {
                circle.classList.add('active');
                circle.style.display = 'flex';
                claimBtn.style.display = 'none';
                status.innerText = "Mining...";
            } else if (mode === 'claim') {
                circle.style.display = 'none'; // Hide circle
                claimBtn.style.display = 'block'; // Show claim button
            }
        }

        async function handleMiningClick() {
            // Only handle click if idle (if mining, do nothing; if claim, button is separate)
            if (document.getElementById('miningTimer').innerText === "Start") {
                try {
                    const res = await fetch(`${API_BASE}/user/mining/start`, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json', 'ngrok-skip-browser-warning': 'true'},
                        body: JSON.stringify({ initData })
                    });
                    const data = await res.json();
                    if(data.status === 'success') {
                        state.startTime = data.start_time;
                        checkMiningStatus();
                    }
                } catch(e) { alert("Failed to start"); }
            }
        }

        async function claimReward() {
            try {
                const res = await fetch(`${API_BASE}/user/mining/complete`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json', 'ngrok-skip-browser-warning': 'true'},
                    body: JSON.stringify({ initData })
                });
                const data = await res.json();
                if(data.status === 'success') {
                    // Celebrate
                    tg.HapticFeedback.notificationOccurred('success');
                    alert("Received 100 SP!");
                    refreshData(); // Reset UI
                } else if (data.status === 'wait') {
                    alert(data.message);
                }
            } catch(e) { alert("Claim failed"); }
        }

        // --- SIGNALS & ALERTS (Ported from old code) ---
        async function loadSignals() {
            try {
                const res = await fetch(`${API_BASE}/market/signals`, {headers: {'ngrok-skip-browser-warning': 'true'}});
                const data = await res.json();
                const list = document.getElementById('signalsList');
                if(!data || !data.length) { list.innerHTML = "No signals"; return; }
                
                list.innerHTML = data.map(s => `
                    <div class="signal-item">
                        <div><b>${s.symbol}</b><br><small>$${s.price}</small></div>
                        <div class="${s.change >= 0 ? 'signal-up' : 'signal-down'}">${s.change}%</div>
                    </div>
                `).join('');
            } catch(e) { console.error(e); }
        }

        async function createAlert() {
            const sym = document.getElementById('alertSymbol').value;
            const px = document.getElementById('alertPrice').value;
            const cond = document.getElementById('alertCondition').value;
            if(!sym || !px) return alert("Fill all fields");

            await fetch(`${API_BASE}/alert/create`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json', 'ngrok-skip-browser-warning': 'true'},
                body: JSON.stringify({ initData, symbol: sym, price: px, condition: cond })
            });
            alert("Alert Set!");
            loadAlerts();
        }

        async function loadAlerts() {
            const res = await fetch(`${API_BASE}/alert/list`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json', 'ngrok-skip-browser-warning': 'true'},
                body: JSON.stringify({ initData })
            });
            const data = await res.json();
            document.getElementById('alertsList').innerHTML = data.map(a => 
                `<div class="signal-item"><div>${a.symbol} ${a.condition} ${a.price}</div><small>${a.status}</small></div>`
            ).join('');
        }
        
        async function upgrade(type) {
             await fetch(`${API_BASE}/user/mining/upgrade`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json', 'ngrok-skip-browser-warning': 'true'},
                body: JSON.stringify({ initData, pack: type })
            });
            refreshData();
        }

    </script>
</body>
</html>

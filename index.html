<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SignalNode DePIN</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --bg: #0b0f19; --card: #151a25; --primary: #3b82f6; --accent: #10b981; --danger: #ef4444; --text: #e2e8f0; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; padding-bottom: 90px; user-select: none; }
        .container { padding: 20px; max-width: 500px; margin: 0 auto; }
        .card { background: var(--card); border-radius: 12px; padding: 16px; margin-bottom: 16px; border: 1px solid rgba(255,255,255,0.05); }
        .btn { background: var(--primary); color: white; border: none; padding: 14px; width: 100%; border-radius: 10px; cursor: pointer; font-weight: bold; margin-top:10px; }
        .btn:disabled { background: #334155; color: #64748b; }
        .pulse { width: 10px; height: 10px; border-radius: 50%; background: var(--danger); box-shadow: 0 0 5px var(--danger); display:inline-block; margin-right:5px; }
        .pulse.active { background: var(--accent); box-shadow: 0 0 10px var(--accent); animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        .progress-bar { width: 100%; height: 6px; background: #1e293b; border-radius: 3px; margin: 15px 0; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--accent); width: 0%; transition: width 1s linear; }
        .signal-row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .nav { position: fixed; bottom: 0; width: 100%; background: rgba(21, 26, 37, 0.95); display: flex; padding: 15px 0; border-top: 1px solid rgba(255,255,255,0.05); }
        .nav-item { flex: 1; text-align: center; opacity: 0.5; font-size: 20px; cursor: pointer; }
        .nav-item.active { opacity: 1; color: var(--primary); }
        .tab { display: none; }
        .tab.active { display: block; }
    </style>
</head>
<body>

    <div id="tab-node" class="container tab active">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h2>Signal<span style="color:var(--primary)">Node</span></h2>
            <div style="text-align:right;">
                <div style="font-size:10px; color:#aaa;">BANDWIDTH POINTS</div>
                <div style="font-size:18px; font-weight:bold;" id="bp-display">0 BP</div>
            </div>
        </div>

        <div class="card">
            <h3><span id="node-light" class="pulse"></span> Node Status</h3>
            <div class="progress-bar"><div class="progress-fill" id="node-bar"></div></div>
            <p id="node-status" style="text-align:center; font-size:12px; color:#aaa;">Offline</p>
            <button id="connect-btn" class="btn" onclick="connectNode()">📡 CONNECT NODE</button>
        </div>

        <div class="card">
            <h3>⚙️ Upgrades</h3>
            <button class="btn" style="background:#1e293b" onclick="upgrade()">⚡ UPGRADE LEVEL (<span id="upg-cost">100</span> BP)</button>
            <button class="btn" style="background:#1e293b" onclick="boost()">🚀 2X BOOST (50 BP)</button>
        </div>
    </div>

    <div id="tab-data" class="container tab">
        <h2>Network <span style="color:var(--primary)">Intel</span></h2>
        <div class="card" id="intel-list">
            <p style="text-align:center; padding:20px;">Fetching Data...</p>
        </div>
    </div>

    <div class="nav">
        <div class="nav-item active" onclick="switchTab('node', this)">⚡</div>
        <div class="nav-item" onclick="switchTab('data', this)">📊</div>
    </div>

<script>
    // ⚠️ PASTE NGROK URL HERE
    const API_URL = "https://your-ngrok-url-here.ngrok-free.app";

    const tg = window.Telegram.WebApp;
    tg.expand();
    const user = tg.initDataUnsafe?.user || { id: 12345, first_name: "Test Node" };
    let timerInterval;

    async function init() {
        await fetchStats();
        await fetchIntel();
    }

    async function fetchStats() {
        try {
            const res = await fetch(`${API_URL}/user/mining/stats`, {
                method: "POST", headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ initData: tg.initData })
            });
            const data = await res.json();
            
            // Update UI
            document.getElementById("bp-display").innerText = Math.floor(data.hashes) + " BP";
            document.getElementById("upg-cost").innerText = data.level * 100;
            
            // Popups
            if (data.just_completed) tg.showPopup({message: `Node Session Complete! +${data.reward_earned} BP`});

            // Logic
            if (data.mining_active) {
                setNodeUI(true, "NODE RELAYING DATA...");
                runTimer(data.mining_progress);
            } else {
                setNodeUI(false, "Node Offline. Connect to earn.");
            }
        } catch (e) { console.log(e); }
    }

    async function connectNode() {
        const btn = document.getElementById("connect-btn");
        btn.innerText = "CONNECTING...";
        try {
            const res = await fetch(`${API_URL}/user/mining/start`, {
                method: "POST", headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ initData: tg.initData })
            });
            const data = await res.json();
            if (data.status === "started") {
                setNodeUI(true, "INITIALIZING...");
                runTimer(0);
            }
        } catch (e) { btn.innerText = "CONNECTION FAILED"; }
    }

    async function fetchIntel() {
        try {
            const res = await fetch(`${API_URL}/market/signals`);
            const data = await res.json();
            const list = document.getElementById("intel-list");
            list.innerHTML = "";
            
            data.forEach(c => {
                let color = c.change > 0 ? "#10b981" : "#ef4444";
                list.innerHTML += `
                <div class="signal-row">
                    <div>
                        <b>${c.symbol}</b>
                        <div style="font-size:11px; color:#aaa">RSI: ${c.rsi} | ${c.strategy}</div>
                    </div>
                    <div style="text-align:right">
                        <div style="color:${color}">${c.change}%</div>
                        <div style="font-size:11px;">$${c.price}</div>
                    </div>
                </div>`;
            });
        } catch (e) {}
    }

    async function upgrade() {
        await fetch(`${API_URL}/user/mining/upgrade`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ initData: tg.initData }) });
        fetchStats();
    }
    async function boost() {
        await fetch(`${API_URL}/user/boost/activate`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ initData: tg.initData }) });
        fetchStats();
    }

    function runTimer(startPct) {
        if(timerInterval) clearInterval(timerInterval);
        let pct = startPct;
        timerInterval = setInterval(() => {
            pct += 0.005; 
            if(pct >= 1) { 
                pct = 1; clearInterval(timerInterval); 
                setNodeUI(false, "SESSION DONE. SYNCING...");
                setTimeout(fetchStats, 2000);
            }
            document.getElementById("node-bar").style.width = (pct * 100) + "%";
        }, 1000);
    }

    function setNodeUI(active, text) {
        const btn = document.getElementById("connect-btn");
        const light = document.getElementById("node-light");
        const status = document.getElementById("node-status");
        
        btn.disabled = active;
        btn.innerText = active ? "NODE ONLINE" : "📡 CONNECT NODE";
        status.innerText = text;
        status.style.color = active ? "#10b981" : "#aaa";
        if(active) light.classList.add("active"); else light.classList.remove("active");
    }

    function switchTab(id, el) {
        document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
        document.querySelectorAll(".nav-item").forEach(n => n.classList.remove("active"));
        document.getElementById("tab-" + id).classList.add("active");
        el.classList.add("active");
    }

    init();
</script>
</body>
</html>

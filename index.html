<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>SignalMania</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
:root{
  --bg:#020617;
  --card:#0b1220;
  --neon:#00f5a0;
  --neon2:#38bdf8;
  --muted:#9ca3af;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:radial-gradient(circle at top,#0f172a,#020617);
  color:white;
  font-family:system-ui,-apple-system,Segoe UI,Roboto;
  height:100vh;
  overflow:hidden;
}
.page{display:none;height:100%;overflow-y:auto;padding:20px;padding-bottom:90px}
.page.active{display:block}
.card{background:#020617;border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:18px;margin-bottom:16px}
.center{text-align:center}
.small{font-size:13px;color:var(--muted)}

.node-circle{
  width:210px;height:210px;border-radius:50%;
  margin:20px auto;display:flex;align-items:center;justify-content:center;flex-direction:column;
  border:2px solid var(--neon);box-shadow:0 0 30px rgba(0,245,160,.3)
}

.btn{
  background:linear-gradient(135deg,var(--neon),var(--neon2));
  color:#020617;border:none;width:100%;padding:14px;border-radius:14px;font-weight:800
}
.btn.secondary{background:#020617;color:white;border:1px solid rgba(255,255,255,.15)}
.btn:disabled{opacity:.5}

.task,.signal{
  background:#020617;padding:14px;border-radius:14px;margin-bottom:12px
}

input,select{
  width:100%;padding:12px;background:#020617;
  border:1px solid rgba(255,255,255,.15);color:white;border-radius:12px;margin-bottom:10px
}

.nav{
  position:fixed;bottom:0;left:0;width:100%;
  display:flex;justify-content:space-around;
  background:#020617;border-top:1px solid rgba(255,255,255,.1);padding:12px 0
}
.nav div{text-align:center;font-size:12px;color:var(--muted)}
.nav .active{color:var(--neon)}
</style>
</head>

<body>

<!-- NODE -->
<div id="node" class="page active">
  <div class="card center">
    <h3>Total Hashes</h3>
    <h1 id="sp">0 SP</h1>
    <p class="small">Secured computation</p>
  </div>

  <div class="node-circle">
    <h3 id="nodeStatus">Node Idle</h3>
    <p id="timer" class="small"></p>
  </div>

  <button id="startBtn" class="btn" onclick="startNode()">Start Node (6h)</button>
</div>

<!-- TASKS -->
<div id="tasks" class="page">
  <h2>🧩 Tasks</h2>

  <div class="task">
    <div><b>Join Telegram</b><p class="small">+50 SP</p></div>
    <button class="btn secondary" onclick="completeTask(this,'join_tg',50)">Do</button>
  </div>

  <div class="task">
    <div><b>Follow Twitter</b><p class="small">+50 SP</p></div>
    <button class="btn secondary" onclick="completeTask(this,'follow_x',50)">Do</button>
  </div>

  <div class="task">
    <div><b>Invite Friend</b><p class="small">+100 SP</p></div>
    <button class="btn secondary" onclick="completeTask(this,'invite',100)">Do</button>
  </div>
</div>

<!-- SIGNALS -->
<div id="signals" class="page">
  <h2>🐋 Whale Tracker</h2>
  <div id="signalsList"></div>
</div>

<!-- ALERTS -->
<div id="alerts" class="page">
  <h2>🔔 Price Alerts</h2>
  <input id="alertSymbol" placeholder="BTC">
  <input id="alertTarget" placeholder="Target Price">
  <select id="alertCond">
    <option value="ABOVE">Above</option>
    <option value="BELOW">Below</option>
  </select>
  <button class="btn" onclick="createAlert()">Create Alert</button>
  <div id="alertList"></div>
</div>

<!-- PROFILE -->
<div id="profile" class="page">
  <h2>👤 Profile</h2>
  <div class="card">
    <p>Your referral link</p>
    <input id="refLink" readonly>
    <button class="btn" onclick="copyLink()">Copy</button>
  </div>
</div>

<!-- NAV -->
<div class="nav">
  <div class="active" onclick="show('node',this)">⛏ Node</div>
  <div onclick="show('tasks',this)">🧩 Tasks</div>
  <div onclick="show('signals',this)">📈 Signals</div>
  <div onclick="show('alerts',this)">🔔 Alerts</div>
  <div onclick="show('profile',this)">👤 Profile</div>
</div>

<script>
const API_BASE = "https://claustral-mable-dissectible.ngrok-free.dev";
const tg = window.Telegram.WebApp;
tg.expand();
const initData = tg.initData;

function headers(json=true){
  return json
    ? {"Content-Type":"application/json","ngrok-skip-browser-warning":"true"}
    : {"ngrok-skip-browser-warning":"true"};
}

function show(id,el){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.querySelectorAll('.nav div').forEach(n=>n.classList.remove('active'));
  el.classList.add('active');
  if(id==="signals") loadSignals();
  if(id==="alerts") loadAlerts();
  if(id==="profile") loadProfile();
}

async function refresh(){
  const r=await fetch(`${API_BASE}/user/mining/stats`,{
    method:"POST",headers:headers(),body:JSON.stringify({initData})
  });
  const d=await r.json();
  sp.innerText=d.sp+" SP";
  nodeStatus.innerText=d.running?"Node Running":"Node Idle";
}

async function startNode(){
  await fetch(`${API_BASE}/user/mining/start`,{
    method:"POST",headers:headers(),body:JSON.stringify({initData})
  });
  refresh();
}

async function loadSignals(){
  signalsList.innerHTML="Loading...";
  const r=await fetch(`${API_BASE}/market/signals?ts=${Date.now()}`,{
    headers:headers(false),cache:"no-store"
  });
  const d=await r.json();
  signalsList.innerHTML=d.map(x=>`
    <div class="signal">
      <b>${x.symbol}</b><br>
      $${Number(x.price).toLocaleString()}
      <span style="color:${x.change>=0?'#00f5a0':'#ef4444'}">
        ${x.change}%
      </span>
    </div>
  `).join("");
}

async function completeTask(btn,id,reward){
  btn.disabled=true;
  const r=await fetch(`${API_BASE}/task/complete`,{
    method:"POST",headers:headers(),
    body:JSON.stringify({initData,task_id:id,reward})
  });
  const d=await r.json();
  if(d.ok){btn.innerText="Done ✓";refresh();}
  else{btn.disabled=false;alert("Already done");}
}

async function createAlert(){
  await fetch(`${API_BASE}/alert/create`,{
    method:"POST",headers:headers(),
    body:JSON.stringify({
      initData,
      symbol:alertSymbol.value,
      target:alertTarget.value,
      condition:alertCond.value
    })
  });
  loadAlerts();
}

async function loadAlerts(){
  const r=await fetch(`${API_BASE}/alert/list`,{
    method:"POST",headers:headers(),body:JSON.stringify({initData})
  });
  const d=await r.json();
  alertList.innerHTML=d.map(a=>`
    <div class="signal">
      ${a[1]} ${a[3]} ${a[2]} — ${a[4]}
      <button onclick="deleteAlert(${a[0]})">❌</button>
    </div>
  `).join("");
}

async function deleteAlert(id){
  await fetch(`${API_BASE}/alert/delete`,{
    method:"POST",headers:headers(),body:JSON.stringify({initData,id})
  });
  loadAlerts();
}

async function loadProfile(){
  const r=await fetch(`${API_BASE}/user/profile`,{
    method:"POST",headers:headers(),body:JSON.stringify({initData})
  });
  const d=await r.json();
  refLink.value=d.referral_link;
}

function copyLink(){
  navigator.clipboard.writeText(refLink.value);
  alert("Copied");
}

refresh();
</script>

</body>
</html>

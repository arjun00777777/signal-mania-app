<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SignalMania</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
:root{
  --bg:#030712;
  --card:#0b1220;
  --accent:#22c55e;
  --danger:#ef4444;
  --neon:#00ffcc;
  --muted:#64748b;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:ui-monospace,monospace;
  background:radial-gradient(circle at top,#050b18,#02040a);
  color:#e5e7eb;
}
.app{max-width:480px;margin:auto;padding-bottom:110px}

.header{text-align:center;padding:18px}
.header h2{margin:0;letter-spacing:2px}
.header .small{color:var(--muted)}

.card{
  background:linear-gradient(180deg,var(--card),#020617);
  border-radius:16px;
  padding:16px;
  margin:12px;
  border:1px solid #0f172a;
  box-shadow:0 0 30px rgba(0,255,204,.04);
}

.btn{
  width:100%;
  padding:14px;
  border:none;
  border-radius:14px;
  font-weight:700;
  background:linear-gradient(135deg,var(--accent),#16a34a);
  color:#022c22;
}
.btn.red{background:linear-gradient(135deg,var(--danger),#b91c1c);color:#fff}
.btn.disabled{opacity:.4;pointer-events:none}

.small{font-size:12px;color:var(--muted)}

.nav{
  position:fixed;bottom:0;left:0;right:0;
  background:#020617;
  border-top:1px solid #0f172a;
  display:flex;height:72px
}
.nav button{
  flex:1;border:none;background:none;
  color:#64748b;font-size:12px
}
.nav button.active{color:var(--neon)}

.terminal{
  background:#020617;
  border:1px solid #0f172a;
  border-radius:12px;
  padding:10px;
  height:120px;
  overflow:hidden;
  font-size:12px;
  color:var(--neon);
}

.scanline{
  animation:scan 2.5s linear infinite;
}
@keyframes scan{
  0%{opacity:.2}50%{opacity:.6}100%{opacity:.2}
}
</style>
</head>

<body>
<div class="app">

<div class="header">
  <h2>▣ SIGNALMANIA</h2>
  <div class="small">Secure Node • Market Signals • Rewards</div>
</div>

<!-- HOME -->
<div id="home" class="page">
  <div class="card">
    <div class="small">NODE STATUS</div>
    <b id="nodeStatus">IDLE</b>
    <div class="small" id="timerText"></div>

    <div class="terminal scanline" id="terminal"></div><br>

    <button id="mineBtn" class="btn" onclick="startMining()">START NODE</button>
  </div>

  <div class="card">
    <div>SP: <b id="sp">0</b></div>
    <div>LEVEL: <b id="level">1</b></div>
  </div>
</div>

<!-- TASKS -->
<div id="tasks" class="page" style="display:none">
  <div class="card">
    <b>DAILY TASK</b><br><br>
    <button id="dailyBtn" class="btn" onclick="claimDaily()">CLAIM DAY</button>
    <div class="small" id="dailyInfo"></div>
  </div>

  <div class="card">
    <b>TASK HISTORY</b>
    <div id="taskHistory" class="small"></div>
  </div>
</div>

</div>

<div class="nav">
  <button class="active" onclick="nav('home',this)">NODE</button>
  <button onclick="nav('tasks',this)">TASKS</button>
</div>

<audio id="clickSound" src="https://assets.mixkit.co/sfx/preview/mixkit-select-click-1109.mp3"></audio>
<audio id="successSound" src="https://assets.mixkit.co/sfx/preview/mixkit-achievement-bell-600.mp3"></audio>

<script>
const API="https://claustral-mable-dissectible.ngrok-free.dev";
const UID=Telegram.WebApp.initDataUnsafe.user.id;

const clickSound=document.getElementById("clickSound");
const successSound=document.getElementById("successSound");

function apiPost(url,data={}){
  data.uid=UID;
  return fetch(API+url,{
    method:"POST",
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify(data)
  }).then(r=>r.json());
}

function nav(id,btn){
  clickSound.play();
  document.querySelectorAll('.page').forEach(p=>p.style.display='none');
  document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));
  document.getElementById(id).style.display='block';
  btn.classList.add('active');
}

let term=document.getElementById("terminal");
function logTerm(t){
  term.innerHTML+=`&gt; ${t}<br>`;
  term.scrollTop=term.scrollHeight;
}

async function refreshMining(){
  const d=await apiPost("/user/mining/stats");
  sp.innerText=d.sp;
  level.innerText=d.level;

  if(!d.running){
    nodeStatus.innerText="IDLE";
    mineBtn.classList.remove("disabled");
    mineBtn.innerText="START NODE";
    timerText.innerText="";
    return;
  }

  nodeStatus.innerText="ACTIVE";
  mineBtn.classList.add("disabled");
  mineBtn.innerText="NODE RUNNING";

  let rem=d.remaining;
  updateTimer(rem);

  let iv=setInterval(()=>{
    rem--;
    updateTimer(rem);
    logTerm("Processing encrypted packets...");
    if(rem<=0){clearInterval(iv);refreshMining();}
  },1000);
}

function updateTimer(sec){
  const h=Math.floor(sec/3600);
  const m=Math.floor((sec%3600)/60);
  const s=sec%60;
  timerText.innerText=`TIME LEFT ${h}h ${m}m ${s}s`;
}

function startMining(){
  clickSound.play();
  mineBtn.classList.add("disabled");
  logTerm("Bootstrapping secure node...");
  apiPost("/user/mining/start").then(refreshMining);
}

async function claimDaily(){
  clickSound.play();
  const r=await apiPost("/claim/daily");
  if(r.ok){
    successSound.play();
    dailyBtn.classList.add("disabled");
    dailyBtn.innerText="CLAIMED";
    taskHistory.innerHTML+=`✔ Claimed Day (+SP) <br>`;
  }
}

setTimeout(()=>{refreshMining()},800);
</script>
</body>
</html>

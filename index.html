<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SignalMania</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
/* ---- SAME STYLES, UNCHANGED ---- */
:root{
  --bg:#0b1020;--card:#121a33;--accent:#4ade80;
  --blue:#60a5fa;--muted:#9ca3af;--danger:#f87171;
}
*{box-sizing:border-box}
body{
  margin:0;font-family:system-ui;
  background:radial-gradient(circle at top,#111827,#020617);
  color:#fff;
}
.app{max-width:480px;margin:auto;padding-bottom:90px}
.header{text-align:center;padding:18px}
.card{background:linear-gradient(180deg,var(--card),#0b122b);
  border-radius:18px;padding:16px;margin:12px}
.btn{
  width:100%;padding:14px;border:none;border-radius:14px;
  font-weight:700;cursor:pointer;
  background:linear-gradient(135deg,var(--accent),#22c55e);
  color:#022c22;
}
.btn.blue{background:linear-gradient(135deg,var(--blue),#2563eb);color:#e0f2fe}
.btn.red{background:linear-gradient(135deg,var(--danger),#ef4444);color:#fff}
.btn.small{padding:8px 10px;font-size:12px}
.btn.disabled{opacity:.5;pointer-events:none}
.small{font-size:13px;color:var(--muted)}
.progress{height:10px;background:#020617;border-radius:8px;overflow:hidden;margin-top:8px}
.progress>div{height:100%;width:0%;background:linear-gradient(90deg,var(--accent),#22c55e)}
.list{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.item{background:#020617;border-radius:14px;padding:12px;
  display:flex;justify-content:space-between;align-items:center}
.green{color:var(--accent)} .red{color:var(--danger)}
.nav{position:fixed;bottom:0;left:0;right:0;background:#020617;
  border-top:1px solid #1e293b;display:flex}
.nav button{flex:1;background:none;border:none;color:#9ca3af;
  padding:10px;font-size:11px}
.nav button.active{color:var(--accent)}
</style>
</head>

<body>
<div class="app">

<div class="header">
  <h2>🚀 SignalMania</h2>
  <div class="small">DPIN Mining • Signals • Rewards</div>
</div>

<!-- HOME -->
<div id="home" class="page">
  <div class="card">
    <div class="small">Node status</div>
    <b id="nodeStatus">Idle</b>
    <div class="small" id="timerText"></div>
    <div class="progress"><div id="progressBar"></div></div><br>
    <button id="mineBtn" class="btn" onclick="startMining()">Start Mining</button>
  </div>

  <div class="card">
    <div>SP: <b id="sp">0</b></div>
    <div>Level: <b id="level">1</b></div>
    <div class="progress"><div id="levelBar"></div></div>
  </div>
</div>

<!-- SIGNALS -->
<div id="signals" class="page" style="display:none">
  <div class="card">
    <div style="display:flex;justify-content:space-between">
      <b>📈 Signals</b>
      <button class="btn blue small" onclick="loadSignals()">↻</button>
    </div>
    <div id="signalsList" class="list"></div>
  </div>
</div>

<!-- DAILY -->
<div id="tasks" class="page" style="display:none">
  <div class="card">
    <b>🎁 Daily Streak</b>
    <div id="dailyGrid" class="list"></div><br>
    <button class="btn blue" onclick="claimDaily()">Claim Today</button>
  </div>
</div>

<!-- ALERTS -->
<div id="alerts" class="page" style="display:none">
  <div class="card">
    <b>Create Alert</b><br><br>
    <input id="aSymbol" placeholder="BTC" style="width:100%;padding:10px;border-radius:10px"/>
    <input id="aTarget" type="number" placeholder="Target"
      style="width:100%;padding:10px;border-radius:10px;margin-top:6px"/>
    <select id="aCond" style="width:100%;padding:10px;border-radius:10px;margin-top:6px">
      <option value="ABOVE">Above</option><option value="BELOW">Below</option>
    </select><br><br>
    <button class="btn" onclick="createAlert()">Create Alert</button>
  </div>
  <div class="card"><b>Your Alerts</b><div id="alertsList" class="list"></div></div>
</div>

<!-- PROFILE -->
<div id="profile" class="page" style="display:none">
  <div class="card">
    <b>👤 Profile</b><div class="small">Referral link</div>
    <input id="refLink" readonly style="width:100%;padding:10px;border-radius:10px"/>
    <br><br><button class="btn blue" onclick="copyRef()">Copy</button>
  </div>
</div>

</div>

<!-- NAV -->
<div class="nav">
  <button class="active" onclick="nav('home',this)">Mine</button>
  <button onclick="nav('signals',this)">Signals</button>
  <button onclick="nav('tasks',this)">Daily</button>
  <button onclick="nav('alerts',this)">Alerts</button>
  <button onclick="nav('profile',this)">Profile</button>
</div>

<script>
const API="https://claustral-mable-dissectible.ngrok-free.dev";
const tg = window.Telegram ? Telegram.WebApp : null;
if (tg) {
  tg.ready();
  tg.expand();
}
const initData=tg.initData;
let miningTimer=null;
const totalSeconds=6*60*60;

/* ---------- NAV FIX ---------- */
function nav(id, btn){
  document.querySelectorAll('.page').forEach(p=>p.style.display='none');
  document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));
  document.getElementById(id).style.display='block';
  btn.classList.add('active');

  if(id==="signals") loadSignals();
  if(id==="alerts") loadAlerts();
  if(id==="tasks") renderDaily();
  if(id==="profile") loadProfile();
}

/* ---------- PROFILE REFRESH (STEP C CORE) ---------- */
async function refreshProfile(){
  const r = await fetch(API+"/user/profile",{
    method:"POST",headers:{'Content-Type':'application/json'},
    body:JSON.stringify({initData})
  });
  const d = await r.json();
  sp.innerText=d.sp;
  level.innerText=d.level;
  levelBar.style.width=((d.xp%500)/500*100)+"%";
}

/* ---------- MINING ---------- */
async function refreshMining(){
  const r=await fetch(API+"/user/mining/stats",{method:"POST",
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({initData})});
  const d=await r.json();
  sp.innerText=d.sp; level.innerText=d.level;

  if(!d.running){
    nodeStatus.innerText="Idle";
    mineBtn.innerText="Start Mining";
    mineBtn.classList.remove("disabled");
    timerText.innerText="";
    progressBar.style.width="0%";
    clearInterval(miningTimer);
    refreshProfile();
    return;
  }

  nodeStatus.innerText="Mining";
  mineBtn.innerText="Mining…";
  mineBtn.classList.add("disabled");

  let rem=d.remaining;
  miningTimer=setInterval(()=>{
    rem--; updateTimer(rem);
    if(rem<=0){clearInterval(miningTimer);refreshMining();}
  },1000);
}

function updateTimer(sec){
  const h=String(Math.floor(sec/3600)).padStart(2,'0');
  const m=String(Math.floor((sec%3600)/60)).padStart(2,'0');
  const s=String(sec%60).padStart(2,'0');
  timerText.innerText=`Remaining ${h}:${m}:${s}`;
  progressBar.style.width=((totalSeconds-sec)/totalSeconds*100)+"%";
}

async function startMining(){
  mineBtn.classList.add("disabled");
  await fetch(API+"/user/mining/start",{method:"POST",
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({initData})});
  refreshMining();
}

/* ---------- SIGNALS ---------- */
async function loadSignals(){
  signalsList.innerHTML="<div class='small'>Loading…</div>";
  const r=await fetch(API+"/market/signals");
  const d=await r.json();
  signalsList.innerHTML="";
  if(!d.length){signalsList.innerHTML="<div class='small'>No signals</div>";return;}
  d.forEach(s=>{
    signalsList.innerHTML+=
      `<div class="item">${s.symbol}
       <span class="${s.change_24h>=0?'green':'red'}">$${s.price}</span></div>`;
  });
}

/* ---------- DAILY ---------- */
function renderDaily(){
  dailyGrid.innerHTML="";
  for(let i=1;i<=7;i++) dailyGrid.innerHTML+=`<div class="item">Day ${i}</div>`;
}

async function claimDaily(){
  const r=await fetch(API+"/claim/daily",{method:"POST",
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({initData})});
  const d=await r.json();
  if(!d.ok){alert("Already claimed today");return;}
  renderDaily();
  refreshProfile();
}

/* ---------- ALERTS ---------- */
async function loadAlerts(){
  const r=await fetch(API+"/alert/list",{method:"POST",
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({initData})});
  const d=await r.json();
  alertsList.innerHTML="";
  d.forEach(a=>{
    alertsList.innerHTML+=
      `<div class="item">${a[1]} ${a[3]} ${a[2]}
       <button class="btn red small" onclick="delAlert(${a[0]})">X</button></div>`;
  });
}

async function createAlert(){
  await fetch(API+"/alert/create",{method:"POST",
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({initData,symbol:aSymbol.value,target:aTarget.value,condition:aCond.value})});
  loadAlerts();
}

async function delAlert(id){
  await fetch(API+"/alert/delete",{method:"POST",
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({initData,id})});
  loadAlerts();
}

/* ---------- PROFILE ---------- */
function loadProfile(){
  refLink.value=`https://t.me/Whale_alert_info_bot?start=${tg.initDataUnsafe.user.id}`;
}
function copyRef(){navigator.clipboard.writeText(refLink.value);}

/* ---------- INIT ---------- */
refreshMining();
refreshProfile();
</script>
</body>
</html>

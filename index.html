<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SignalMania</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
:root{
  --bg:#0b1020;
  --card:#121a33;
  --accent:#4ade80;
  --blue:#60a5fa;
  --muted:#9ca3af;
  --danger:#f87171;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui;
  background:radial-gradient(circle at top,#111827,#020617);
  color:#fff;
}
.app{max-width:480px;margin:auto;padding-bottom:90px}
.header{text-align:center;padding:18px}
.card{
  background:linear-gradient(180deg,var(--card),#0b122b);
  border-radius:18px;
  padding:16px;
  margin:12px;
}
.btn{
  width:100%;padding:14px;border:none;border-radius:14px;
  font-weight:700;cursor:pointer;
  background:linear-gradient(135deg,var(--accent),#22c55e);
  color:#022c22;
}
.btn.blue{
  background:linear-gradient(135deg,var(--blue),#2563eb);
  color:#e0f2fe;
}
.btn.disabled{opacity:.5;pointer-events:none}
.small{font-size:13px;color:var(--muted)}

.progress{
  height:10px;background:#020617;border-radius:8px;overflow:hidden;margin-top:10px
}
.progress > div{
  height:100%;width:0%;background:linear-gradient(90deg,var(--accent),#22c55e);
  transition:width 1s linear;
}

.list{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.item{
  background:#020617;border-radius:14px;padding:12px;
  display:flex;justify-content:space-between;align-items:center
}
.green{color:var(--accent)}
.red{color:var(--danger)}

.nav{
  position:fixed;bottom:0;left:0;right:0;
  background:#020617;border-top:1px solid #1e293b;
  display:flex
}
.nav button{
  flex:1;background:none;border:none;color:#9ca3af;
  padding:12px;font-size:12px
}
.nav button.active{color:var(--accent)}
</style>
</head>

<body>
<div class="app">

<div class="header">
  <h2>🚀 SignalMania</h2>
  <div class="small">DPIN Mining • Signals</div>
</div>

<!-- HOME / MINING -->
<div id="home" class="page">
  <div class="card">
    <div class="small">Node status</div>
    <b id="nodeStatus">Idle</b>
    <div class="small" id="timerText"></div>

    <div class="progress"><div id="progressBar"></div></div>

    <br>
    <button id="mineBtn" class="btn" onclick="startMining()">Start Mining</button>
  </div>

  <div class="card">
    <div>SP: <b id="sp">0</b></div>
    <div>Level: <b id="level">1</b></div>
  </div>
</div>

<!-- SIGNALS -->
<div id="signals" class="page" style="display:none">
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <b>📈 Market Signals</b>
      <button class="btn blue" style="width:auto;padding:8px 12px" onclick="loadSignals()">↻</button>
    </div>
    <div class="small" id="signalTime"></div>
    <div id="signalsList" class="list">
      <div class="small">Fetching signals…</div>
    </div>
  </div>
</div>

</div>

<!-- NAV -->
<div class="nav">
  <button class="active" onclick="nav('home')">Home</button>
  <button onclick="nav('signals')">Signals</button>
</div>

<script>
const API = "https://claustral-mable-dissectible.ngrok-free.dev";
const tg = Telegram.WebApp;
tg.ready(); tg.expand();
const initData = tg.initData;

let miningTimer=null;
let totalSeconds=6*60*60;

function nav(id){
  document.querySelectorAll('.page').forEach(p=>p.style.display='none');
  document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));
  document.getElementById(id).style.display='block';
  event.target.classList.add('active');
  if(id==="signals") loadSignals();
}

async function refreshMining(){
  const r=await fetch(API+"/user/mining/stats",{
    method:"POST",headers:{'Content-Type':'application/json'},
    body:JSON.stringify({initData})
  });
  const d=await r.json();

  document.getElementById("sp").innerText=d.sp;
  document.getElementById("level").innerText=d.level;

  if(!d.running){
    document.getElementById("nodeStatus").innerText="Idle";
    document.getElementById("mineBtn").innerText="Start Mining";
    document.getElementById("mineBtn").classList.remove("disabled");
    document.getElementById("timerText").innerText="";
    document.getElementById("progressBar").style.width="0%";
    if(miningTimer) clearInterval(miningTimer);
    return;
  }

  document.getElementById("nodeStatus").innerText="Mining";
  document.getElementById("mineBtn").innerText="Mining…";
  document.getElementById("mineBtn").classList.add("disabled");

  let remaining=d.remaining;
  updateTimer(remaining);

  miningTimer=setInterval(()=>{
    remaining--;
    updateTimer(remaining);
    if(remaining<=0){
      clearInterval(miningTimer);
      refreshMining(); // auto-finish
    }
  },1000);
}

function updateTimer(sec){
  const h=String(Math.floor(sec/3600)).padStart(2,'0');
  const m=String(Math.floor((sec%3600)/60)).padStart(2,'0');
  const s=String(sec%60).padStart(2,'0');
  document.getElementById("timerText").innerText=`Remaining ${h}:${m}:${s}`;
  const pct=((totalSeconds-sec)/totalSeconds)*100;
  document.getElementById("progressBar").style.width=pct+"%";
}

async function startMining(){
  document.getElementById("mineBtn").classList.add("disabled");
  await fetch(API+"/user/mining/start",{
    method:"POST",headers:{'Content-Type':'application/json'},
    body:JSON.stringify({initData})
  });
  refreshMining();
}

async function loadSignals(){
  const box=document.getElementById("signalsList");
  box.innerHTML='<div class="small">Fetching signals…</div>';
  try{
    const r=await fetch(API+"/market/signals");
    const d=await r.json();
    box.innerHTML="";
    if(!d.length){
      box.innerHTML='<div class="small">No signals right now</div>';
      return;
    }
    document.getElementById("signalTime").innerText="Updated just now";
    d.forEach(s=>{
      box.innerHTML+=`
        <div class="item">
          ${s.symbol}
          <span class="${s.change_24h>=0?'green':'red'}">
            $${s.price}
          </span>
        </div>`;
    });
  }catch{
    box.innerHTML='<div class="small">Failed to load signals</div>';
  }
}

refreshMining();
</script>
</body>
</html>
